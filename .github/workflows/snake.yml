name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate Purple Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WaradHussain
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ffffff&color_dots=#f0e6ff,#d4a8ff,#A78BFA,#7c3aed,#4c1d95
            dist/github-contribution-grid-snake-dark.svg?color_snake=ffffff&color_dots=#0D1117,#2d1b4e,#4c1d95,#7c3aed,#A78BFA

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
