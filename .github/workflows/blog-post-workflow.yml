name: Update Blog Posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch from Hashnode GraphQL and inject into README
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import re

          query = """
          {
            publication(host: "warad.hashnode.dev") {
              posts(first: 5) {
                edges {
                  node {
                    title
                    url
                    publishedAt
                    brief
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({"query": query}).encode("utf-8")
          req = urllib.request.Request(
              "https://gql.hashnode.com",
              data=payload,
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read())
              posts = data["data"]["publication"]["posts"]["edges"]
              print(f"Fetched {len(posts)} posts from Hashnode.")
          except Exception as e:
              print(f"API error: {e}")
              posts = []

          if not posts:
              block = "\n> No articles yet — check back at [warad.hashnode.dev](https://warad.hashnode.dev)\n\n"
          else:
              lines = ["\n"]
              for edge in posts:
                  node  = edge["node"]
                  title = node["title"].replace("|", "\\|")
                  url   = node["url"]
                  date  = node["publishedAt"][:10]
                  brief = (node.get("brief") or "").strip()[:100].replace("|", "\\|")
                  lines.append(f"**[{title}]({url})** &nbsp; `{date}`")
                  if brief:
                      lines.append(f"> {brief}...")
                  lines.append("")
              lines.append("")
              block = "\n".join(lines)

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->"
          replacement = f"<!-- BLOG-POST-LIST:START -->{block}<!-- BLOG-POST-LIST:END -->"

          new_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(new_readme)

          print("README updated.")
          EOF

      - name: Commit Updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update latest blog posts"
          git push
